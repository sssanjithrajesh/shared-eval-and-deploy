[project]
name = "shared-eval-and-deploy"
version = "0.1.0"
description = "One eval gate and one deploy template reused by every project in this portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
seval = "seval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seval"]

[tool.hatch.build.targets.wheel.force-include]
"deploy" = "seval/deploy_templates"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
