# Floors copied from legacy-test-writer/evals/gate.json, rewritten as path checks.
# Regenerated numbers live in that repo; this file is the shared-gate shape.
checks:
  - path: emitted
    op: gte
    value: 900
    reason: generator must still emit a full suite
  - path: held
    op: lte
    value: 20
    reason: review queue must stay small
  - path: generated.coverage.line_rate
    op: gte
    value: 0.8
    reason: generated line coverage floor
  - path: generated.failures
    op: eq
    value: 0
  - path: next.errors
    op: gte
    value: 1
    reason: 1.5 must still fail to compile (API hide)
